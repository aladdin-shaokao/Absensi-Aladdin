<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Absensi - Aladdin Shao Kao</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-slate-100 text-slate-800">

    <!-- HALAMAN LOGIN -->
    <div id="loginPage" class="min-h-screen flex flex-col items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 border border-slate-200">
            <div class="text-center mb-6">
                <div class="flex justify-center mb-0">
                    <div class="w-40 h-40 flex items-center justify-center overflow-hidden">
                        <img src="logo_aladdin.png" alt="Logo Aladdin Shao Kao" class="max-h-full max-w-full object-contain">
                    </div>
                </div>
                <h1 class="text-2xl font-bold text-red-600">Aladdin Shao Kao</h1>
                <p class="text-sm text-slate-500 mt-1">Portal Login Absensi Karyawan</p>
            </div>
            
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Username</label>
                    <input type="text" id="username" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-red-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-red-500 text-sm">
                </div>
                <button type="submit" id="loginBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-lg transition text-sm shadow-md">
                    Masuk Portal
                </button>
            </form>
            <div id="loginError" class="mt-4 text-center text-xs text-red-500 font-medium hidden"></div>
        </div>

        <footer class="mt-6 text-center text-xs text-slate-400 font-medium">
            &copy; 2026 Aladdin Management System
        </footer>
    </div>

    <!-- HALAMAN DASHBOARD -->
    <div id="dashboardPage" class="hidden min-h-screen pb-12">
        <header class="bg-white shadow-sm border-b border-slate-200 px-4 sm:px-6 py-4">
            <div class="max-w-6xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                
                <!-- BAGIAN ATAS / KIRI: INFORMASI USER & LOGO -->
                <div class="flex items-start justify-between md:justify-start md:items-center gap-3">
                    <div>
                        <h2 id="welcomeName" class="font-bold text-base sm:text-lg text-slate-800 leading-snug">Halo, Karyawan</h2>
                        <div class="flex flex-wrap gap-1.5 sm:gap-2 mt-1.5">
                            <span id="userRoleBadge" class="text-[11px] sm:text-xs bg-red-50 text-red-600 font-semibold px-2 py-0.5 rounded">Role: Staff</span>
                            <span id="userDeptBadge" class="text-[11px] sm:text-xs bg-blue-50 text-blue-600 font-semibold px-2 py-0.5 rounded">Dept: -</span>
                            <span id="userAreaBadge" class="text-[11px] sm:text-xs bg-emerald-50 text-emerald-600 font-semibold px-2 py-0.5 rounded">Area: -</span>
                        </div>
                    </div>

                    <!-- Logo Aladdin (Kanan Atas di HP, Kiri di Laptop) -->
                    <img src="logo_aladdin.png" alt="Logo" class="w-20 h-20 sm:w-24 sm:h-24 object-contain md:order-first">
                </div>

                <!-- BAGIAN TOMBOL AKSI -->
                <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-100 md:border-t-0 md:pt-0">
                    <button onclick="openPermissionModal()" class="flex-1 md:flex-none justify-center bg-red-600 hover:bg-red-700 text-white text-xs font-semibold px-4 py-2.5 rounded-lg transition shadow-sm flex items-center gap-1">
                        <span>+</span> <span>Ajukan Izin</span>
                    </button>
                    <button onclick="logout()" class="flex-1 md:flex-none justify-center bg-slate-100 hover:bg-red-50 text-red-600 text-xs font-semibold px-4 py-2.5 rounded-lg transition border border-slate-200">
                        Keluar
                    </button>
                </div>

            </div>
        </header>

        <main class="max-w-6xl mx-auto px-4 mt-8 space-y-8">
            <!-- REKAP IZIN (DROPDOWN / ACCORDION & BATAS 10 BARIS) -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <button onclick="toggleAccordion('permissionContent', 'permissionIcon')" class="w-full p-4 bg-slate-50 hover:bg-slate-100 flex justify-between items-center transition border-b border-slate-200 text-left">
                    <div class="flex items-center space-x-2">
                        <span class="font-bold text-slate-800 text-sm sm:text-base">Riwayat Pengajuan Izin / Tidak Masuk</span>
                        <span id="permCountBadge" class="text-xs bg-red-100 text-red-600 px-2.5 py-0.5 rounded-full font-semibold">0 Izin</span>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span onclick="event.stopPropagation(); fetchPermissions();" class="text-xs text-red-600 hover:underline font-semibold">Refresh</span>
                        <svg id="permissionIcon" class="w-5 h-5 text-slate-500 transform transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </div>
                </button>
                <div id="permissionContent" class="hidden p-4">
                    <div id="permissionTableContainer" class="overflow-x-auto">
                        <div class="text-center text-slate-400 py-3 text-xs">Memuat data pengajuan izin...</div>
                    </div>
                </div>
            </div>

            <!-- ABSENSI FINGERPRINT -->
            <div>
                <div class="flex justify-between items-center mb-4">
                    <h3 id="tableTitle" class="font-bold text-slate-800 text-base">Riwayat Kehadiran & Lembur</h3>
                    <span class="text-xs bg-red-50 text-red-600 px-3 py-1 rounded-full font-semibold">Data Fingerprint</span>
                </div>
                <div id="accordionContainer" class="space-y-4"></div>
            </div>
        </main>
    </div>

    <!-- MODAL POPUP FORM IZIN -->
    <div id="permissionModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-100 transform transition-all">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                <h3 class="font-bold text-slate-800 text-base">Form Pengajuan Izin</h3>
                <button onclick="closePermissionModal()" class="text-slate-400 hover:text-slate-600 font-bold text-lg">&times;</button>
            </div>
            <form onsubmit="handlePermissionSubmit(event)" oninput="validateForm()" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Jenis Izin</label>
                    <select id="permJenis" onchange="togglePhotoUpload(); validateForm();" required class="w-full px-3 py-2 rounded-lg border border-slate-300 text-xs focus:ring-2 focus:ring-red-500">
                        <option value="">-- Pilih Jenis Izin --</option>
                        <option value="Sakit">Sakit</option>
                        <option value="Izin Keperluan Pribadi">Izin Keperluan Pribadi</option>
                        <option value="Cuti">Cuti</option>
                        <option value="Dinas Luar">Dinas Luar</option>
                    </select>
                </div>

                <!-- UPLOAD FOTO (MUNCUL JIKA SAKIT) -->
                <div id="photoUploadContainer" class="hidden">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Upload Bukti Surat Sakit <span class="text-red-500">*</span></label>
                    <input type="file" id="permFile" accept="image/*" onchange="validateForm()" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-xs file:mr-3 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-red-50 file:text-red-600 hover:file:bg-red-100">
                    <p class="text-[10px] text-slate-400 mt-1">*Format gambar (JPG, PNG, JPEG)</p>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Mulai Tgl</label>
                        <input type="date" id="permStartDate" onchange="validateForm()" required class="w-full px-3 py-2 rounded-lg border border-slate-300 text-xs focus:ring-2 focus:ring-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Selesai Tgl</label>
                        <input type="date" id="permEndDate" onchange="validateForm()" required class="w-full px-3 py-2 rounded-lg border border-slate-300 text-xs focus:ring-2 focus:ring-red-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Alasan / Catatan</label>
                    <textarea id="permAlasan" rows="3" oninput="validateForm()" required placeholder="Tuliskan detail alasan Anda berhalangan hadir..." class="w-full px-3 py-2 rounded-lg border border-slate-300 text-xs focus:ring-2 focus:ring-red-500"></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closePermissionModal()" class="px-4 py-2 rounded-lg text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-600">Batal</button>
                    <!-- Tombol default disabled sampai form valid -->
                    <button type="submit" id="submitPermBtn" disabled class="px-4 py-2 rounded-lg text-xs font-semibold bg-red-600 hover:bg-red-700 text-white opacity-50 cursor-not-allowed">Kirim Pengajuan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxFwt1rTArWbj40k5ioM39uR9XHwhfFCqyFOaShaTxU9g2twB3MnyESXgWCZQyl1qeu/exec";

        let currentUserData = null;

        function formatDateToId(dateStr) {
            if (!dateStr || dateStr === '-') return '-';
            let cleanDate = dateStr.split('T')[0];
            let parts = cleanDate.split('-');
            if (parts.length !== 3) return dateStr;

            let year = parts[0];
            let monthIndex = parseInt(parts[1], 10) - 1;
            let day = parts[2];

            const months = ['JAN', 'FEB', 'MAR', 'APR', 'MEI', 'JUN', 'JUL', 'AGU', 'SEP', 'OKT', 'NOV', 'DES'];
            let monthName = months[monthIndex] || 'JAN';

            return `${day} ${monthName} ${year}`;
        }

        function togglePhotoUpload() {
            const jenis = document.getElementById('permJenis').value;
            const container = document.getElementById('photoUploadContainer');
            const fileInput = document.getElementById('permFile');

            if (jenis === 'Sakit') {
                container.classList.remove('hidden');
                fileInput.required = true;
            } else {
                container.classList.add('hidden');
                fileInput.required = false;
                fileInput.value = ""; 
            }
        }

        function validateForm() {
            const jenis = document.getElementById('permJenis').value;
            const startDate = document.getElementById('permStartDate').value;
            const endDate = document.getElementById('permEndDate').value;
            const alasan = document.getElementById('permAlasan').value;
            const fileInput = document.getElementById('permFile');
            const submitBtn = document.getElementById('submitPermBtn');

            let isComplete = true;

            if (!jenis || !startDate || !endDate || !alasan) {
                isComplete = false;
            }

            if (jenis === 'Sakit' && (!fileInput.files || fileInput.files.length === 0)) {
                isComplete = false;
            }

            if (isComplete) {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('loginError');

            btn.disabled = true;
            btn.innerText = "Memeriksa...";
            errorDiv.classList.add('hidden');

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "login", username, password })
                });
                const result = await response.json();

                if (result.success) {
                    currentUserData = result.user;
                    localStorage.setItem('user', JSON.stringify(result.user));
                    loadDashboard(result.user);
                } else {
                    errorDiv.innerText = result.message || "Gagal masuk. Periksa kembali data Anda.";
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.innerText = "Terjadi kesalahan koneksi ke server.";
                errorDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = "Masuk Portal";
            }
        }

        function loadDashboard(user) {
            currentUserData = user;
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('dashboardPage').classList.remove('hidden');
            document.getElementById('welcomeName').innerText = `Halo, ${user.name}`;
            document.getElementById('userRoleBadge').innerText = `Role: ${user.role}`;
            document.getElementById('userDeptBadge').innerText = `Dept: ${user.department || '-'}`;
            document.getElementById('userAreaBadge').innerText = `Area: ${user.statusArea || '-'}`;

            if (user.role === 'Manager') {
                document.getElementById('tableTitle').innerText = "Rekapitulasi Kehadiran & Lembur Karyawan (Manager View)";
            }

            fetchAttendanceData(user);
            fetchPermissions();
        }

        function openPermissionModal() {
            document.getElementById('permissionModal').classList.remove('hidden');
            validateForm();
        }

        function closePermissionModal() {
            document.getElementById('permissionModal').classList.add('hidden');
        }

        async function handlePermissionSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('submitPermBtn');
            btn.disabled = true;
            btn.innerText = "Mengirim...";

            const jenis = document.getElementById('permJenis').value;
            const fileInput = document.getElementById('permFile');

            let fileData = "";
            let fileName = "";

            if (jenis === 'Sakit' && fileInput.files.length > 0) {
                const file = fileInput.files[0];
                fileName = `${currentUserData.username}_${Date.now()}_${file.name}`;
                fileData = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            }

            const payload = {
                action: "submitPermission",
                username: currentUserData.username,
                name: currentUserData.name,
                department: currentUserData.department,
                statusArea: currentUserData.statusArea,
                jenisIzin: jenis,
                startDate: formatDateToId(document.getElementById('permStartDate').value),
                endDate: formatDateToId(document.getElementById('permEndDate').value),
                alasan: document.getElementById('permAlasan').value,
                fileData: fileData,
                fileName: fileName
            };

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const res = await response.json();
                if (res.success) {
                    Swal.fire('Berhasil!', 'Pengajuan izin Anda telah terkirim.', 'success');
                    closePermissionModal();
                    document.getElementById('permJenis').value = "";
                    document.getElementById('permStartDate').value = "";
                    document.getElementById('permEndDate').value = "";
                    document.getElementById('permAlasan').value = "";
                    document.getElementById('permFile').value = "";
                    fetchPermissions();
                } else {
                    Swal.fire('Gagal!', res.message || 'Gagal mengirim izin.', 'error');
                }
            } catch (err) {
                Swal.fire('Error!', 'Terjadi kesalahan koneksi.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerText = "Kirim Pengajuan";
            }
        }

        async function fetchPermissions() {
            const container = document.getElementById('permissionTableContainer');
            const badge = document.getElementById('permCountBadge');
            
            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "getPermissions", username: currentUserData.username, role: currentUserData.role })
                });
                const result = await response.json();

                if (result.success && result.data.length > 0) {
                    let totalData = result.data.length;
                    if (badge) badge.innerText = `${totalData} Izin`;

                    // Urutkan dari terbaru, batasi maksimal 10 baris saja
                    let sortedData = result.data.reverse().slice(0, 10);

                    let html = `<table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="bg-slate-50 text-slate-500 border-b border-slate-200">
                                ${currentUserData.role === 'Manager' ? '<th class="p-2.5">Nama</th>' : ''}
                                <th class="p-2.5">Jenis Izin</th>
                                <th class="p-2.5">Tanggal</th>
                                <th class="p-2.5">Alasan</th>
                                <th class="p-2.5">Bukti Foto</th>
                                <th class="p-2.5">Status</th>
                            </tr>
                        </thead>
                        <tbody>`;

                    sortedData.forEach(row => {
                        let badgeStyle = "bg-amber-50 text-amber-600";
                        if (row.status === "Approved") badgeStyle = "bg-emerald-50 text-emerald-600";
                        if (row.status.includes("Reject")) badgeStyle = "bg-rose-50 text-rose-600";

                        let photoLink = row.fileUrl && row.fileUrl.startsWith("http") 
                            ? `<a href="${row.fileUrl}" target="_blank" class="text-blue-600 font-bold hover:underline">Lihat Bukti</a>` 
                            : `-`;

                        let statusBadge = "";
                        if (currentUserData.role === 'Manager') {
                            let btnClass = 'bg-amber-100 text-amber-700 hover:bg-amber-200';
                            if (row.status === 'Approved') btnClass = 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200';
                            if (row.status.includes('Reject')) btnClass = 'bg-rose-100 text-rose-700 hover:bg-rose-200';

                            statusBadge = `<button onclick="togglePermissionStatus(this, ${row.rowIndex})" class="px-2 py-1 rounded text-[10px] font-bold transition ${btnClass}">${row.status}</button>`;
                        } else {
                            statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-semibold ${badgeStyle}">${row.status}</span>`;
                        }

                        html += `<tr class="border-b border-slate-100 hover:bg-slate-50">
                            ${currentUserData.role === 'Manager' ? `<td class="p-2.5 font-semibold text-slate-700">${row.name}</td>` : ''}
                            <td class="p-2.5 font-medium text-blue-600">${row.jenisIzin}</td>
                            <td class="p-2.5 text-slate-600 whitespace-nowrap">${row.tanggalRange}</td>
                            <td class="p-2.5 text-slate-500">${row.alasan}</td>
                            <td class="p-2.5">${photoLink}</td>
                            <td class="p-2.5">${statusBadge}</td>
                        </tr>`;
                    });

                    html += `</tbody></table>`;
                    if (totalData > 10) {
                        html += `<div class="text-center text-[11px] text-slate-400 mt-2">Menampilkan 10 pengajuan terakhir dari total ${totalData} data.</div>`;
                    }
                    if (container) container.innerHTML = html;
                } else {
                    if (badge) badge.innerText = `0 Pengajuan`;
                    if (container) container.innerHTML = `<div class="text-center text-slate-400 py-3 text-xs">Belum ada data pengajuan izin.</div>`;
                }
            } catch (err) {
                if (container) container.innerHTML = `<div class="text-center text-red-500 py-3 text-xs">Gagal memuat data izin.</div>`;
            }
        }

        function togglePermissionStatus(btn, rowIndex) {
            let currentText = btn.innerText;
            let nextStatus = currentText === 'Pending' ? 'Approved' : (currentText === 'Approved' ? 'Rejected' : 'Pending');
            let nextClass = nextStatus === 'Approved' ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200' : (nextStatus === 'Rejected' ? 'bg-rose-100 text-rose-700 hover:bg-rose-200' : 'bg-amber-100 text-amber-700 hover:bg-amber-200');

            btn.innerText = nextStatus;
            btn.className = `px-2 py-1 rounded text-[10px] font-bold transition ${nextClass}`;

            fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "updatePermissionStatus", rowIndex: rowIndex, status: nextStatus })
            }).catch(err => console.error("Gagal memperbarui status izin"));
        }

        async function fetchAttendanceData(user) {
            const container = document.getElementById('accordionContainer');
            if (container) container.innerHTML = `<div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-center text-slate-400">Memuat data dari Google Sheet...</div>`;

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "getAttendance", name: user.name, role: user.role })
                });
                const result = await response.json();

                if (result.success && result.data.length > 0) {
                    result.data.sort((a, b) => new Date(b.date) - new Date(a.date));

                    checkPendingOvertime(result.data);

                    let groupedData = {};
                    result.data.forEach(row => {
                        if (!row.date || row.date === '-') return;
                        let monthKey = row.date.substring(0, 7);
                        if (!groupedData[monthKey]) {
                            groupedData[monthKey] = [];
                        }
                        groupedData[monthKey].push(row);
                    });

                    let currentDateObj = new Date();
                    let currentMonthKey = currentDateObj.getFullYear() + '-' + String(currentDateObj.getMonth() + 1).padStart(2, '0');

                    if (container) container.innerHTML = "";
                    let sortedMonths = Object.keys(groupedData).sort().reverse();

                    sortedMonths.forEach(monthKey => {
                        let rows = groupedData[monthKey];
                        let isOpen = (monthKey === currentMonthKey);
                        
                        let [year, monthNum] = monthKey.split('-');
                        let dateObj = new Date(year, monthNum - 1, 1);
                        let monthName = dateObj.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
                        let contentId = `content-${monthKey}`;
                        let iconId = `icon-${monthKey}`;

                        let tableHeaders = user.role === 'Manager' 
                            ? `<th class="p-3">Nama Karyawan</th><th class="p-3">Tanggal</th><th class="p-3">Status Kerja</th><th class="p-3">Masuk</th><th class="p-3">Keluar</th><th class="p-3">Total Jam</th><th class="p-3">Lembur</th><th class="p-3">Status Lembur</th><th class="p-3">Keterangan</th>`
                            : `<th class="p-3">Tanggal</th><th class="p-3">Status Kerja</th><th class="p-3">Masuk</th><th class="p-3">Keluar</th><th class="p-3">Total Jam</th><th class="p-3">Lembur</th><th class="p-3">Status Lembur</th><th class="p-3">Keterangan</th>`;

                        let tableRowsHtml = "";
                        rows.forEach(row => {
                            let badgeColor = row.status === 'ON-TIME' || row.status === 'Good' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600';
                            let formattedDate = formatDateToId(row.date);
                            
                            let overtimeDisplay = `-`;
                            if (row.overtime && row.overtime > 0) {
                                let exactMinutes = row.overtimeMinutes !== undefined ? row.overtimeMinutes : (row.overtime * 60);
                                overtimeDisplay = `<span class="font-bold text-blue-600">+${row.overtime} Jam <span class="text-[10px] text-slate-500 font-normal">(${exactMinutes} mnt)</span></span>`;
                            }
                            
                            let otStatusBadge = "";
                            if (row.overtime && row.overtime > 0) {
                                if (user.role === 'Manager') {
                                    let currentStatus = row.overtimeStatus || 'Pending';
                                    let btnClass = 'bg-amber-100 text-amber-700 hover:bg-amber-200';
                                    if (currentStatus === 'Approved') btnClass = 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200';
                                    if (currentStatus === 'Reject' || currentStatus.includes('Rejected')) btnClass = 'bg-rose-100 text-rose-700 hover:bg-rose-200';

                                    otStatusBadge = `<button onclick="toggleOvertime(this, ${row.rowIndex})" class="px-2.5 py-1 rounded text-[10px] font-bold transition ${btnClass}">${currentStatus}</button>`;
                                } else {
                                    let currentStatus = row.overtimeStatus || 'Pending';
                                    let badgeStyle = 'bg-amber-50 text-amber-600';
                                    if (currentStatus === 'Approved') badgeStyle = 'bg-emerald-50 text-emerald-600';
                                    if (currentStatus === 'Reject' || currentStatus.includes('Rejected')) badgeStyle = 'bg-rose-50 text-rose-600';

                                    otStatusBadge = `<span class="px-2 py-1 rounded text-[10px] font-semibold ${badgeStyle}">${currentStatus}</span>`;
                                }
                            } else {
                                otStatusBadge = `<span class="text-slate-300">-</span>`;
                            }

                            if (user.role === 'Manager') {
                                tableRowsHtml += `
                                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                                        <td class="p-3 font-semibold text-slate-700">${row.name}</td>
                                        <td class="p-3 whitespace-nowrap">${formattedDate}</td>
                                        <td class="p-3 font-medium">${row.workingStatus}</td>
                                        <td class="p-3 text-emerald-600 font-semibold">${row.entryTime}</td>
                                        <td class="p-3 text-rose-600 font-semibold">${row.exitTime}</td>
                                        <td class="p-3 font-mono">${row.workHours}</td>
                                        <td class="p-3">${overtimeDisplay}</td>
                                        <td class="p-3">${otStatusBadge}</td>
                                        <td class="p-3"><span class="px-2 py-1 rounded text-[10px] font-semibold ${badgeColor}">${row.status}</span></td>
                                    </tr>
                                `;
                            } else {
                                tableRowsHtml += `
                                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                                        <td class="p-3 whitespace-nowrap">${formattedDate}</td>
                                        <td class="p-3 font-medium">${row.workingStatus}</td>
                                        <td class="p-3 text-emerald-600 font-semibold">${row.entryTime}</td>
                                        <td class="p-3 text-rose-600 font-semibold">${row.exitTime}</td>
                                        <td class="p-3 font-mono">${row.workHours}</td>
                                        <td class="p-3">${overtimeDisplay}</td>
                                        <td class="p-3">${otStatusBadge}</td>
                                        <td class="p-3"><span class="px-2 py-1 rounded text-[10px] font-semibold ${badgeColor}">${row.status}</span></td>
                                    </tr>
                                `;
                            }
                        });

                        if (container) {
                            container.innerHTML += `
                                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                    <button onclick="toggleAccordion('${contentId}', '${iconId}')" class="w-full p-4 bg-slate-50 hover:bg-slate-100 flex justify-between items-center transition border-b border-slate-200 text-left">
                                        <div class="flex items-center space-x-2">
                                            <span class="font-bold text-slate-800 text-sm sm:text-base capitalize">Absensi ${monthName}</span>
                                            <span class="text-xs bg-red-100 text-red-600 px-2.5 py-0.5 rounded-full font-semibold">${rows.length} Hari</span>
                                        </div>
                                        <svg id="${iconId}" class="w-5 h-5 text-slate-500 transform ${isOpen ? 'rotate-180' : ''} transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                        </svg>
                                    </button>
                                    <div id="${contentId}" class="${isOpen ? '' : 'hidden'} overflow-x-auto">
                                        <table class="w-full text-left border-collapse text-xs">
                                            <thead>
                                                <tr class="bg-slate-50/50 text-slate-500 border-b border-slate-200">
                                                    ${tableHeaders}
                                                </tr>
                                            </thead>
                                            <tbody>
                                                ${tableRowsHtml}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            `;
                        }
                    });

                } else {
                    if (container) container.innerHTML = `<div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-center text-slate-400">Belum ada catatan absensi.</div>`;
                }
            } catch (err) {
                if (container) container.innerHTML = `<div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-center text-red-500">Gagal memuat data absensi.</div>`;
            }
        }

        function checkPendingOvertime(attendanceDataList) {
            if (currentUserData && currentUserData.role === "Manager") {
                return;
            }

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            let hasPendingOvertime = false;
            let pendingCount = 0;

            attendanceDataList.forEach(function(item) {
                if (item.overtime && item.overtime > 0 && item.overtimeStatus && item.overtimeStatus.toLowerCase() === "pending") {
                    
                    let attendanceDate = new Date(item.date);
                    attendanceDate.setHours(0, 0, 0, 0);

                    let diffTime = today.getTime() - attendanceDate.getTime();
                    let diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

                    if (diffDays <= 10) {
                        hasPendingOvertime = true;
                        pendingCount++;
                    } else {
                        item.overtimeStatus = "Rejected (Expired)";
                    }
                }
            });

            if (hasPendingOvertime) {
                if (typeof Swal !== 'undefined') {
                    Swal.fire({
                        icon: 'warning',
                        title: 'Pemberitahuan Lembur',
                        html: `Anda mempunyai <b>${pendingCount}</b> data lemburan yang masih berstatus <b>Pending</b>.<br><br>` +
                              `Silakan segera menghubungi Manager untuk meminta Approval.<br><br>` +
                              `<span class="text-red-600 font-semibold text-xs">Note: Batas maximum Approved adalah H+10. Jika melewati batas tersebut, maka status Pending akan otomatis direject oleh sistem.</span>`,
                        confirmButtonText: 'Baik, Mengerti',
                        confirmButtonColor: '#dc2626'
                    });
                } else {
                    alert(`PEMBERITAHUAN:\nAnda mempunyai ${pendingCount} data lemburan yang masih status Pending. Silakan menghubungi Manager untuk meminta Approved.\n\nNote: Batas maximum Approved adalah H+10. Jika melewati batas tersebut, maka status Pending akan otomatis direject oleh sistem.`);
                }
            }
        }

        function toggleOvertime(btn, rowIndex) {
            let currentText = btn.innerText;
            let nextStatus = "";
            let nextClass = "";

            if (currentText === 'Pending') {
                nextStatus = 'Approved';
                nextClass = 'px-2.5 py-1 rounded text-[10px] font-bold transition bg-emerald-100 text-emerald-700 hover:bg-emerald-200';
            } else if (currentText === 'Approved') {
                nextStatus = 'Reject';
                nextClass = 'px-2.5 py-1 rounded text-[10px] font-bold transition bg-rose-100 text-rose-700 hover:bg-rose-200';
            } else {
                nextStatus = 'Pending';
                nextClass = 'px-2.5 py-1 rounded text-[10px] font-bold transition bg-amber-100 text-amber-700 hover:bg-amber-200';
            }

            btn.innerText = nextStatus;
            btn.className = nextClass;

            fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "updateOvertimeStatus", rowIndex: rowIndex, status: nextStatus })
            }).catch(err => console.error("Gagal memperbarui status lembur"));
        }

        function toggleAccordion(contentId, iconId) {
            const content = document.getElementById(contentId);
            const icon = document.getElementById(iconId);
            if (content) content.classList.toggle('hidden');
            if (icon) icon.classList.toggle('rotate-180');
        }

        function logout() {
            currentUserData = null;
            localStorage.removeItem('user');
            document.getElementById('dashboardPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('username').value = "";
            document.getElementById('password').value = "";
        }

        window.onload = function() {
            const savedUser = localStorage.getItem('user');
            if (savedUser) {
                currentUserData = JSON.parse(savedUser);
                loadDashboard(currentUserData);
            }
        }
    </script>
</body>
</html>
