<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Absensi - Aladdin Shao Kao</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-slate-100 text-slate-800">

    <!-- HALAMAN LOGIN -->
    <div id="loginPage" class="min-h-screen flex flex-col items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 border border-slate-200">
            <div class="text-center mb-6">
                <!-- LOGO ALADDIN SHAO KAO -->
                <div class="flex justify-center mb-0">
                    <div class="w-40 h-40 flex items-center justify-center overflow-hidden">
                        <img src="logo_aladdin.png" alt="Logo Aladdin Shao Kao" class="max-h-full max-w-full object-contain">
                    </div>
                </div>
                <h1 class="text-2xl font-bold text-red-600">Aladdin Shao Kao</h1>
                <p class="text-sm text-slate-500 mt-1">Portal Login Absensi Karyawan</p>
            </div>
            
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Username</label>
                    <input type="text" id="username" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-red-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-red-500 text-sm">
                </div>
                <button type="submit" id="loginBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-lg transition text-sm shadow-md">
                    Masuk Portal
                </button>
            </form>
            <div id="loginError" class="mt-4 text-center text-xs text-red-500 font-medium hidden"></div>
        </div>

        <!-- FOOTER COPYRIGHT -->
        <footer class="mt-6 text-center text-xs text-slate-400 font-medium">
            &copy; 2026 Aladdin Management System
        </footer>
    </div>

    <!-- HALAMAN DASHBOARD -->
    <div id="dashboardPage" class="hidden min-h-screen pb-12">
        <!-- Topbar -->
        <header class="bg-white shadow-sm border-b border-slate-200 px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="logo_aladdin.png" alt="Logo" class="w-20 h-20 object-contain">
                <div>
                    <h2 id="welcomeName" class="font-bold text-lg text-slate-800">Halo, Karyawan</h2>
                    <p id="userRoleBadge" class="text-xs text-red-600 font-semibold">Role: Staff</p>
                </div>
            </div>
            <button onclick="logout()" class="bg-slate-100 hover:bg-red-50 text-red-600 text-xs font-semibold px-4 py-2 rounded-lg transition border border-slate-200">
                Keluar
            </button>
        </header>

        <!-- Content Area -->
        <main class="max-w-5xl mx-auto px-4 mt-8">
            <div class="flex justify-between items-center mb-4">
                <h3 id="tableTitle" class="font-bold text-slate-800 text-base">Riwayat Kehadiran</h3>
                <span class="text-xs bg-red-50 text-red-600 px-3 py-1 rounded-full font-semibold">Data Fingerprint</span>
            </div>
            
            <!-- Container Daftar Bulan / Accordion -->
            <div id="accordionContainer" class="space-y-4">
                <!-- Data akan dimuat secara dinamis ke sini -->
            </div>
        </main>
    </div>

    <script>
        // URL Web App Google Apps Script Anda
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxLce5OHnZgW8QG-JKZV3YvuulqAh5WvKONJZ7iGfyUmpzU9XKZl1oL0OsxE18G0DWL/exec";

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('loginError');

            btn.disabled = true;
            btn.innerText = "Memeriksa...";
            errorDiv.classList.add('hidden');

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "login", username, password })
                });
                const result = await response.json();

                if (result.success) {
                    localStorage.setItem('user', JSON.stringify(result.user));
                    loadDashboard(result.user);
                } else {
                    errorDiv.innerText = result.message || "Gagal masuk. Periksa kembali data Anda.";
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.innerText = "Terjadi kesalahan koneksi ke server.";
                errorDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = "Masuk Portal";
            }
        }

        function loadDashboard(user) {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('dashboardPage').classList.remove('hidden');
            document.getElementById('welcomeName').innerText = `Halo, ${user.name}`;
            document.getElementById('userRoleBadge').innerText = `Akses: ${user.role}`;

            if (user.role === 'Manager') {
                document.getElementById('tableTitle').innerText = "Rekapitulasi Kehadiran Seluruh Karyawan (Manager View)";
            }

            fetchAttendanceData(user);
        }

        async function fetchAttendanceData(user) {
            const container = document.getElementById('accordionContainer');
            container.innerHTML = `<div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-center text-slate-400">Memuat data dari Google Sheet...</div>`;

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "getAttendance", name: user.name, role: user.role })
                });
                const result = await response.json();

                if (result.success && result.data.length > 0) {
                    // 1. Urutkan data dari tanggal terbaru ke terlama (Descending) -> Baris teratas adalah hari ini
                    result.data.sort((a, b) => new Date(b.date) - new Date(a.date));

                    // 2. Kelompokkan data berdasarkan Bulan & Tahun (Format: 'YYYY-MM')
                    let groupedData = {};
                    result.data.forEach(row => {
                        if (!row.date || row.date === '-') return;
                        let monthKey = row.date.substring(0, 7); // Contoh: "2026-10"
                        if (!groupedData[monthKey]) {
                            groupedData[monthKey] = [];
                        }
                        groupedData[monthKey].push(row);
                    });

                    // Dapatkan bulan berjalan saat ini secara otomatis (misal: "2026-10")
                    let currentDateObj = new Date();
                    let currentMonthKey = currentDateObj.getFullYear() + '-' + String(currentDateObj.getMonth() + 1).padStart(2, '0');

                    container.innerHTML = "";
                    
                    // Urutkan kunci bulan dari yang terbaru (Descending)
                    let sortedMonths = Object.keys(groupedData).sort().reverse();

                    sortedMonths.forEach(monthKey => {
                        let rows = groupedData[monthKey];
                        let isOpen = (monthKey === currentMonthKey); // Otomatis terbuka jika bulan berjalan
                        
                        // Format Judul Bulan (Bahasa Indonesia)
                        let [year, monthNum] = monthKey.split('-');
                        let dateObj = new Date(year, monthNum - 1, 1);
                        let monthName = dateObj.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
                        let contentId = `content-${monthKey}`;
                        let iconId = `icon-${monthKey}`;

                        let tableHeaders = user.role === 'Manager' 
                            ? `<th class="p-3">Nama Karyawan</th><th class="p-3">Tanggal</th><th class="p-3">Status Kerja</th><th class="p-3">Masuk (In)</th><th class="p-3">Keluar (Out)</th><th class="p-3">Total Jam</th><th class="p-3">Keterangan</th>`
                            : `<th class="p-3">Tanggal</th><th class="p-3">Status Kerja</th><th class="p-3">Masuk (In)</th><th class="p-3">Keluar (Out)</th><th class="p-3">Total Jam</th><th class="p-3">Keterangan</th>`;

                        let tableRowsHtml = "";
                        rows.forEach(row => {
                            let badgeColor = row.status === 'ON-TIME' || row.status === 'Good' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600';
                            let formattedDate = row.date ? row.date.split('T')[0] : '-';
                            
                            if (user.role === 'Manager') {
                                tableRowsHtml += `
                                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                                        <td class="p-3 font-semibold text-slate-700">${row.name}</td>
                                        <td class="p-3">${formattedDate}</td>
                                        <td class="p-3 font-medium">${row.workingStatus || '-'}</td>
                                        <td class="p-3 text-emerald-600 font-semibold">${row.entryTime}</td>
                                        <td class="p-3 text-rose-600 font-semibold">${row.exitTime}</td>
                                        <td class="p-3 font-mono">${row.workHours}</td>
                                        <td class="p-3"><span class="px-2 py-1 rounded text-[10px] font-semibold ${badgeColor}">${row.status}</span></td>
                                    </tr>
                                `;
                            } else {
                                tableRowsHtml += `
                                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                                        <td class="p-3">${formattedDate}</td>
                                        <td class="p-3 font-medium">${row.workingStatus || '-'}</td>
                                        <td class="p-3 text-emerald-600 font-semibold">${row.entryTime}</td>
                                        <td class="p-3 text-rose-600 font-semibold">${row.exitTime}</td>
                                        <td class="p-3 font-mono">${row.workHours}</td>
                                        <td class="p-3"><span class="px-2 py-1 rounded text-[10px] font-semibold ${badgeColor}">${row.status}</span></td>
                                    </tr>
                                `;
                            }
                        });

                        // Render Kotak Accordion Per Bulan
                        container.innerHTML += `
                            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                <button onclick="toggleAccordion('${contentId}', '${iconId}')" class="w-full p-4 bg-slate-50 hover:bg-slate-100 flex justify-between items-center transition border-b border-slate-200 text-left">
                                    <div class="flex items-center space-x-2">
                                        <span class="font-bold text-slate-800 text-sm sm:text-base capitalize">Absensi ${monthName}</span>
                                        <span class="text-xs bg-red-100 text-red-600 px-2.5 py-0.5 rounded-full font-semibold">${rows.length} Hari</span>
                                    </div>
                                    <svg id="${iconId}" class="w-5 h-5 text-slate-500 transform ${isOpen ? 'rotate-180' : ''} transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                    </svg>
                                </button>
                                <div id="${contentId}" class="${isOpen ? '' : 'hidden'} overflow-x-auto">
                                    <table class="w-full text-left border-collapse text-xs">
                                        <thead>
                                            <tr class="bg-slate-50/50 text-slate-500 border-b border-slate-200">
                                                ${tableHeaders}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${tableRowsHtml}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        `;
                    });

                } else {
                    container.innerHTML = `<div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-center text-slate-400">Belum ada catatan absensi.</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-center text-red-500">Gagal memuat data absensi.</div>`;
            }
        }

        function toggleAccordion(contentId, iconId) {
            const content = document.getElementById(contentId);
            const icon = document.getElementById(iconId);
            content.classList.toggle('hidden');
            icon.classList.toggle('rotate-180');
        }

        function logout() {
            localStorage.removeItem('user');
            document.getElementById('dashboardPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('username').value = "";
            document.getElementById('password').value = "";
        }

        window.onload = function() {
            const savedUser = localStorage.getItem('user');
            if (savedUser) {
                loadDashboard(JSON.parse(savedUser));
            }
        }
    </script>
</body>
</html>
