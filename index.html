<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Absensi & Lembur</title>
    <!-- Memuat Bootstrap CSS untuk tampilan rapi -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Memuat SweetAlert2 untuk Popup yang Elegan -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">

    <!-- Navbar Sederhana -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Sistem Absensi & Lembur</span>
            <span id="userInfo" class="text-white"></span>
        </div>
    </nav>

    <div class="container">
        <!-- Form Login Sederhana (Jika belum login) -->
        <div id="loginSection" class="row justify-content-center" style="margin-top: 100px;">
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">Login Karyawan</h3>
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" id="username" class="form-control" placeholder="Masukkan username">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" placeholder="Masukkan password">
                        </div>
                        <button onclick="handleLogin()" class="btn btn-primary w-100">Login</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bagian Dashboard Absensi (Muncul setelah Login) -->
        <div id="dashboardSection" style="display: none;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2>Data Absensi & Lembur</h2>
                <button onclick="handleLogout()" class="btn btn-outline-danger btn-sm">Logout</button>
            </div>

            <div class="card shadow">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered table-striped align-middle">
                            <table-header class="table-dark">
                                <tr>
                                    <th>No</th>
                                    <th>Nama</th>
                                    <th>Tanggal</th>
                                    <th>Status Kerja</th>
                                    <th>Masuk</th>
                                    <th>Keluar</th>
                                    <th>Total Jam</th>
                                    <th>Status Absen</th>
                                    <th>Lembur (Jam)</th>
                                    <th>Status Lembur</th>
                                </tr>
                            </table-header>
                            <tbody id="attendanceTableBody">
                                <!-- Data akan dimuat secara dinamis via JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Utama Frontend -->
    <script>
        // GANTI URL DI BAWAH INI DENGAN WEB APP URL GOOGLE APPS SCRIPT ANDA
        const API_URL = "https://script.google.com/macros/s/AKfycbxFwt1rTArWbj40k5ioM39uR9XHwhfFCqyFOaShaTxU9g2twB3MnyESXgWCZQyl1qeu/exec"; 

        let currentUser = null;

        // Fungsi Login
        function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (!user || !pass) {
                Swal.fire('Peringatan', 'Username dan Password wajib diisi!', 'warning');
                return;
            }

            Swal.showLoading();

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: "login",
                    username: user,
                    password: pass
                })
            })
            .then(res => res.json())
            .then(result => {
                Swal.close();
                if (result.success) {
                    currentUser = result.user;
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('dashboardSection').style.display = 'block';
                    document.getElementById('userInfo').innerText = `Login sebagai: ${currentUser.name} (${currentUser.role})`;
                    
                    // Tarik data absensi setelah berhasil login
                    loadAttendanceData();
                } else {
                    Swal.fire('Gagal', result.message || 'Login gagal!', 'error');
                }
            })
            .catch(err => {
                Swal.close();
                Swal.fire('Error', 'Terjadi kesalahan koneksi.', 'error');
                console.error(err);
            });
        }

        // Fungsi Logout
        function handleLogout() {
            currentUser = null;
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('dashboardSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
        }

        // Fungsi Mengambil Data Absensi dari Backend Apps Script
        function loadAttendanceData() {
            Swal.fire({
                title: 'Memuat Data...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: "getAttendance",
                    name: currentUser.name,
                    role: currentUser.role
                })
            })
            .then(res => res.json())
            .then(result => {
                Swal.close();
                if (result.success) {
                    renderAttendanceTable(result.data);
                    
                    // Jalankan pengecekan lembur Pending & batas H+3 secara otomatis setelah data selesai loading
                    checkPendingOvertime(result.data);
                } else {
                    Swal.fire('Gagal', result.message || 'Gagal memuat data absensi.', 'error');
                }
            })
            .catch(err => {
                Swal.close();
                Swal.fire('Error', 'Gagal terhubung ke server.', 'error');
                console.error(err);
            });
        }

        // Fungsi Merender Tabel Absensi
        function renderAttendanceTable(dataList) {
            const tbody = document.getElementById('attendanceTableBody');
            tbody.innerHTML = '';

            if (!dataList || dataList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="text-center">Tidak ada data absensi.</td></tr>`;
                return;
            }

            dataList.forEach((item, index) => {
                let row = `<tr>
                    <td>${index + 1}</td>
                    <td>${item.name}</td>
                    <td>${item.date}</td>
                    <td>${item.workingStatus}</td>
                    <td>${item.entryTime}</td>
                    <td>${item.exitTime}</td>
                    <td>${item.workHours}</td>
                    <td><span class="badge bg-secondary">${item.status}</span></td>
                    <td>${item.overtime} Jam</td>
                    <td><span class="badge ${item.overtimeStatus === 'Pending' ? 'bg-warning text-dark' : 'bg-success'}">${item.overtimeStatus}</span></td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        // --- FITUR BARU: PENGECEKAN LEMBUR PENDING & BATAS MAKSIMUM H+3 ---
        function checkPendingOvertime(attendanceDataList) {
            // Jika role manager, Anda bisa melewati pengecekan pop-up karyawan ini jika diinginkan
            if (currentUser && currentUser.role === "Manager") {
                return; 
            }

            const today = new Date(); // Mengacu pada tanggal sistem hari ini
            today.setHours(0, 0, 0, 0);

            let hasPendingOvertime = false;
            let pendingCount = 0;

            attendanceDataList.forEach(function(item) {
                // Cek apakah ada jam lembur (> 0) dan statusnya masih "Pending"
                if (item.overtime && item.overtime > 0 && item.overtimeStatus && item.overtimeStatus.toLowerCase() === "pending") {
                    
                    let attendanceDate = new Date(item.date); // Format tanggal dari item (YYYY-MM-DD)
                    attendanceDate.setHours(0, 0, 0, 0);

                    // Hitung selisih hari antara hari ini dengan tanggal absensi kejadian lembur
                    let diffTime = today.getTime() - attendanceDate.getTime();
                    let diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

                    // Batas maximum approve adalah H+3 (artinya selisih hari <= 3 hari)
                    if (diffDays <= 3) {
                        hasPendingOvertime = true;
                        pendingCount++;
                    } else {
                        // Jika sudah melewati H+3, status otomatis berubah menjadi Reject (Expired)
                        item.overtimeStatus = "Rejected (Expired)";
                    }
                }
            });

            // Tampilkan Pop-up pemberitahuan jika ditemukan data lembur pending dalam rentang H+3
            if (hasPendingOvertime) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Pemberitahuan Lembur',
                    text: `Anda mempunyai ${pendingCount} data lemburan yang masih berstatus Pending. Silakan segera menghubungi Manager untuk meminta Approval. (Batas maksimal approval adalah H+3).`,
                    confirmButtonText: 'Baik, Mengerti',
                    confirmButtonColor: '#3085d6'
                });
            }
        }
    </script>
</body>
</html>
